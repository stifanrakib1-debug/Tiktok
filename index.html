<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফ্রি সাপোর্টি কমিউনিটি</title>
    <style>
        body {
            background: linear-gradient(135deg, #fe2c55, #69c9d0); /* TikTok style gradient */
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:'Arial', sans-serif;
            text-align:center;
            color:white;
        }
        h1 { font-size:2rem; margin-bottom:20px; animation: pulse 5s infinite; }
        p { font-size:1.2rem; margin-bottom:30px; }
        a {
            display:inline-block;
            text-decoration:none;
            background:white;
            color:#fe2c55;
            padding:12px 30px;
            border-radius:8px;
            font-weight:bold;
            transition: transform 0.3s, background 0.3s;
        }
        a:hover { transform: scale(1.1); background:#ffd6e0; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @media(max-width:600px){
            h1 { font-size:1.6rem; }
            p { font-size:1rem; }
        }
    </style>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const whatsappLink = "https://whatsapp.com/channel/0029Vb6JNGmCsU9Nu9lsmY0t";
            // Auto redirect after 5 seconds (5000ms)
            setTimeout(() => {
                window.location.href = whatsappLink;
            }, 5000);
        });
    </script>
</head>
<body>
    <div>
        <h1>✨ফ্রি সাপোর্টি কমিউনিটিতে স্বাগতম!✨</h1>
        <p>🔥ফ্রিতে ভিডিও ভাইরাল করতে🔥…</p>
        <p> ✅আমাদের কমিউনিটিত জয়েন করুন✅:</p>
        <a href="https://whatsapp.com/channel/0029Vb6JNGmCsU9Nu9lsmY0t" target="_blank">এখানেই যোগ দিন</a>
    </div>
</body>
</html>
